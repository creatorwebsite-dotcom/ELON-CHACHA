name: ELON CHACHA Automated 2-Hour Recruitment & The Hindu Sync

on:
  # 1. CONNECTS DIRECTLY TO CRON-JOB.ORG (/dispatches -> 204 No Content)
  # Every execution from cron-job.org at 1:30, 3:30, 5:30, 7:30, 9:30, 11:30 IST
  # immediately triggers this workflow within 1 second.
  repository_dispatch:

  # 2. SINGLE BACKUP SCHEDULE (Every 2 Hours on the Hour)
  schedule:
    - cron: '0 */2 * * *'

  # 3. MANUAL TRIGGER FROM GITHUB ACTIONS OR ADMIN PANEL (admin.html)
  workflow_dispatch:
    inputs:
      purge_oldest_2_days:
        description: 'Option B Manual Trigger: Delete oldest N days posts from JSON databases?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      prune_days_count:
        description: 'Number of oldest days to permanently delete when pruning'
        required: false
        default: '2'
        type: string
      rebuild_google_seo:
        description: 'Rebuild Google JobPosting Schema, Sitemap.xml & RSS for SARKARI NAUKAR BANEGA?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  # 4. ONLY RUN ON CODE PUSH IF SCRAPER, BOT OR WORKFLOW CODE CHANGED
  push:
    branches:
      - main
    paths:
      - 'multi_agent_scraper.py'
      - 'the_hindu_bot.py'
      - '.github/workflows/scraper.yml'

permissions:
  contents: write

concurrency:
  group: sarkari-portal-live-sync-${{ github.ref }}
  # Never cancel an active scrape mid-run
  cancel-in-progress: false

jobs:
  scrape-enrich-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Complete Scraping, Parsing & Network Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 beautifulsoup4 curl_cffi lxml

      - name: Run The Hindu 3-Day Broadsheet & GK Bot (Isolated Broadsheet Pipeline)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_PURGE_OLDEST_2_DAYS: ${{ github.event.inputs.purge_oldest_2_days || 'false' }}
          PRUNE_DAYS_COUNT: ${{ github.event.inputs.prune_days_count || '2' }}
          PROJECT_REPO_NAME: "ELON CHACHA"
          PORTAL_BRAND_NAME: "SARKARI NAUKAR BANEGA"
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          echo "Starting The Hindu 3-Day Broadsheet Sync via [${{ github.event_name }}] at $(TZ='Asia/Kolkata' date +'%Y-%m-%d %I:%M:%S %p IST')..."
          python -m py_compile the_hindu_bot.py || true
          timeout 180s python the_hindu_bot.py || echo "The Hindu Bot completed with fallback protection."

      - name: Verify Syntax & Run Multi-Agent Recruitment Scraper (6 Categories Pipeline)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_PURGE_OLDEST_2_DAYS: ${{ github.event.inputs.purge_oldest_2_days || 'false' }}
          PRUNE_DAYS_COUNT: ${{ github.event.inputs.prune_days_count || '2' }}
          PROJECT_REPO_NAME: "ELON CHACHA"
          GITHUB_REPO_SLUG: ${{ github.repository }}
          PORTAL_BRAND_NAME: "SARKARI NAUKAR BANEGA"
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: |
          echo "Verifying Python Syntax for multi_agent_scraper.py..."
          python -m py_compile multi_agent_scraper.py
          echo "Starting Multi-Agent Recruitment Scraper via [${{ github.event_name }}] at $(TZ='Asia/Kolkata' date +'%Y-%m-%d %I:%M:%S %p IST')..."
          timeout 300s python multi_agent_scraper.py || echo "Scraper cycle finished with safety guard."

      - name: Agentic Post-Processor (Broadsheet Firewall, Date Tags, Unique Quotes & Google JobPosting SEO)
        env:
          TRIGGER_SOURCE: ${{ github.event_name }}
          GITHUB_REPO_SLUG: ${{ github.repository }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL || '' }}
        run: |
          python - << 'EOF'
          import json, os, re, hashlib
          from datetime import datetime, timezone, timedelta
          from xml.sax.saxutils import escape as xml_escape

          ist = timezone(timedelta(hours=5, minutes=30))
          now_ist = datetime.now(ist)
          today_date = now_ist.date()
          stamp_str = now_ist.strftime("%d %b %Y, %I:%M:%S %p IST")
          iso_str = now_ist.strftime("%Y-%m-%dT%H:%M:%S+05:30")
          trigger_src = os.environ.get("TRIGGER_SOURCE", "schedule")

          # Determine public portal URL for Google Schema & Sitemap (Never exposes 'ELON CHACHA' as brand title)
          repo_slug = os.environ.get("GITHUB_REPO_SLUG", "").strip()
          custom_url = os.environ.get("PORTAL_SITE_URL", "").strip()
          if custom_url:
              base_site_url = custom_url.rstrip("/")
          elif "/" in repo_slug:
              owner, rname = repo_slug.split("/", 1)
              base_site_url = f"https://{owner}.github.io/{rname}"
          else:
              base_site_url = "https://sarkarinaukarbanega.com"

          # -------------------------------------------------------------------------
          # 1. STRICT BROADSHEET FIREWALL (NEVER ALLOW BROADSHEET ITEMS IN 6 BOXES)
          # -------------------------------------------------------------------------
          BROADSHEET_BLOCK_PATTERNS = re.compile(
              r"(the\s*hindu|broadsheet|editorial\s*&\s*opinion|op-ed|cracker\s*conundrum|"
              r"f1['’]?s\s*youngest\s*champion|daily\s*broadsheet|hindu\s*editorial)",
              re.IGNORECASE
          )

          def is_broadsheet_leaked_item(item):
              if not isinstance(item, dict):
                  return False
              src = str(item.get("source", "") or item.get("source_type", "") or item.get("origin", "")).lower()
              if "hindu" in src or "broadsheet" in src or "editorial" in src:
                  return True
              if item.get("isBroadsheet") is True or item.get("broadsheet_only") is True:
                  return True
              cat = str(item.get("category", "") or item.get("box", "")).lower()
              if cat in ("editorial", "editorials", "broadsheet", "the_hindu"):
                  return True
              title = str(item.get("title", "") or item.get("post_title", "") or item.get("name", ""))
              url = str(item.get("url", "") or item.get("apply_link", "") or item.get("link", "")).lower()
              if "thehindu.com" in url or BROADSHEET_BLOCK_PATTERNS.search(title):
                  return True
              return False

          # -------------------------------------------------------------------------
          # 2. SMART DATE PARSER & AUTO TAGGER ([Today Last Date] & [Last Date Extended])
          # -------------------------------------------------------------------------
          DATE_FORMATS = [
              "%Y-%m-%d", "%d-%m-%Y", "%d/%m/%Y", "%d.%m.%Y",
              "%d %b %Y", "%d %B %Y", "%b %d, %Y", "%B %d, %Y",
              "%d-%b-%Y", "%d-%B-%Y", "%Y/%m/%d"
          ]

          def parse_any_date(raw_val):
              if not raw_val or not isinstance(raw_val, str):
                  return None
              clean = re.sub(r"(extended|upto|up\s*to|till|last\s*date\s*:?)", "", raw_val, flags=re.IGNORECASE).strip()
              clean = re.sub(r"\s+", " ", clean)
              m = re.search(r"(\d{1,4}[-/.\s]+(?:[A-Za-z]{3,9}|\d{1,2})[-/.\s]+\d{2,4})", clean)
              candidates = [m.group(1).strip(), clean] if m else [clean]
              for cand in candidates:
                  for fmt in DATE_FORMATS:
                      try:
                          dt = datetime.strptime(cand, fmt).date()
                          if 2024 <= dt.year <= 2035:
                              return dt
                      except Exception:
                          pass
              return None

          # -------------------------------------------------------------------------
          # 3. OPTION A + OPTION B UNIQUE INTENT QUOTE ENGINE (ZERO DUPLICATE QUOTES)
          # -------------------------------------------------------------------------
          DOMAIN_QUOTES_BANK = {
              "DEFENCE_POLICE": [
                  "वर्दी सिर्फ एक लिबास नहीं, करोड़ों देशवासियों के भरोसे और आपके शौर्य की पहचान है — {role} का यह अवसर आपकी रगों के जोश को राष्ट्रसेवा में बदलने का समय है!",
                  "सीमा की सुरक्षा और कानून का इक़बाल आपके कंधों के सितारों से चमकता है; {role} की इस परीक्षा में अपनी मेहनत की मिसाल कायम कर दीजिए!",
                  "जब हौसला फौलादी हो तो हर शारीरिक और लिखित परीक्षा आसान हो जाती है — {role} की वर्दी आपका इंतज़ार कर रही है!"
              ],
              "BANKING_FINANCE": [
                  "देश की आर्थिक रफ़्तार और करोड़ों परिवारों की बचत का भरोसा एक कुशल बैंकर के हाथ में होता है — {role} में आपकी स्पीड और सटीकता ही आपकी सबसे बड़ी जीत बनेगी!",
                  "हर सटीक कैलकुलेशन और हर सही फैसला आपको {role} की कुर्सी के और करीब ले जाता है; आज की प्रैक्टिस कल की फाइनेंशियल लीडरशिप है!",
                  "बैंकिंग सेक्टर में समय और एक्यूरेसी का संगम ही सफलता की कुंजी है — {role} के इस सुनहरे मौके को अपने नाम कर लीजिए!"
              ],
              "RAILWAYS": [
                  "कश्मीर से कन्याकुमारी तक देश की धड़कन को जोड़ने वाली भारतीय रेल में {role} बनना सिर्फ नौकरी नहीं, करोड़ों यात्रियों की मंज़िल का सारथी बनना है!",
                  "जैसे ट्रेन अपने सिग्नल और ट्रैक पर बिना रुके मंज़िल तक पहुँचती है, वैसे ही {role} के इस लक्ष्य तक अपनी तैयारी की रफ़्तार कायम रखिए!",
                  "भारतीय रेलवे के विशाल नेटवर्क में {role} का यह पद आपके परिवार के गौरव और सुरक्षित भविष्य की सबसे मज़बूत पटरी है!"
              ],
              "TEACHING_EDUCATION": [
                  "एक शिक्षक क्लासरूम में सिर्फ पाठ नहीं पढ़ाता, वह आने वाले भारत का भविष्य गढ़ता है — {role} का यह पद आपके ज्ञान को राष्ट्र-निर्माण में बदलने का मंच है!",
                  "किताबों की समझ और समझाने की कला जब मिलती है तो एक आदर्श {role} का जन्म होता है; अपनी तैयारी पर पूरा विश्वास रखिए!",
                  "शिक्षा की मशाल जलाने वाले {role} का सम्मान हर दौर में सर्वोच्च रहता है — इस अवसर को अपनी विद्वत्ता से हासिल करें!"
              ],
              "MEDICAL_HEALTH": [
                  "जब उम्मीदें थम जाती हैं तब एक स्वास्थ्यकर्मी का समर्पण नया जीवन देता है — {role} का यह पद सेवा और सम्मान का सबसे पवित्र संगम है!",
                  "मानवता की सेवा और चिकित्सा विज्ञान की दक्षता के साथ {role} के इस लक्ष्य को अपनी मेहनत से साकार कीजिए!"
              ],
              "ENGINEERING_TECH": [
                  "आधुनिक भारत के इंफ्रास्ट्रक्चर और टेक्नोलॉजी की नींव एक कुशल इंजीनियर के विज़न पर टिकी है — {role} में अपनी तकनीकी महारत साबित करने का यही सही समय है!",
                  "हर जटिल समस्या का सटीक समाधान निकालना ही एक सच्चे {role} की पहचान है — अपने कॉन्सेप्ट्स को मज़बूत रखें, जीत पक्की है!"
              ],
              "CIVIL_ADMIN_SSC": [
                  "संविधान की मर्यादा और प्रशासन की ज़मीनी ताकत एक निष्पक्ष अधिकारी के कलम से चलती है — {role} का यह पद आपकी वर्षों की तपस्या का गौरवशाली परिणाम बनेगा!",
                  "सरकारी तंत्र की रीढ़ बनकर आम नागरिक के चेहरे पर मुस्कान लाना ही {role} का असली धर्म है; पूरी निष्ठा से इस अवसर को हासिल करें!",
                  "धैर्य, अनुशासन और निरंतर अभ्यास से {role} की मंज़िल अब आपके बिल्कुल सामने है — अपना सर्वश्रेष्ठ प्रदर्शन दीजिए!"
              ]
          }

          def classify_and_build_unique_quote(item):
              title = str(item.get("title", "") or item.get("post_title", "") or "Sarkari Recruitment").strip()
              dept = str(item.get("department", "") or item.get("organization", "") or "").strip()
              combined = f"{title} {dept}".lower()

              if re.search(r"\b(police|constable|si|sub\s*inspector|army|agniveer|navy|air\s*force|crpf|bsf|cisf|itbp|ssb|nda|cds|defence|home\s*guard|kotwal)\b", combined):
                  domain = "DEFENCE_POLICE"
              elif re.search(r"\b(bank|sbi|ibps|rbi|nabard|lic|niacl|clerk|po|probationary|specialist\s*officer|finance|audit|account)\b", combined):
                  domain = "BANKING_FINANCE"
              elif re.search(r"\b(railway|rrb|rrc|ntpc|group\s*d|alp|loco\s*pilot|station\s*master|metro|dfccil|irctc)\b", combined):
                  domain = "RAILWAYS"
              elif re.search(r"\b(teacher|tet|ctet|prt|tgt|pgt|professor|lecturer|faculty|kvs|nvs|DSSSB|school|education)\b", combined):
                  domain = "TEACHING_EDUCATION"
              elif re.search(r"\b(nurse|nursing|aiims|doctor|medical|pharmacist|anm|gnm|health|hospital|esic)\b", combined):
                  domain = "MEDICAL_HEALTH"
              elif re.search(r"\b(engineer|je|ae|gate|isro|drdo|bhel|ntpc|ioc|ongc|technical|iti|diploma|polytechnic)\b", combined):
                  domain = "ENGINEERING_TECH"
              else:
                  domain = "CIVIL_ADMIN_SSC"

              templates = DOMAIN_QUOTES_BANK[domain]
              digest = int(hashlib.sha256(title.encode("utf-8")).hexdigest()[:8], 16)
              chosen_tpl = templates[digest % len(templates)]

              clean_role = re.sub(r"\b(online\s*form|2025|2026|2027|recruitment|notification|apply\s*online|out|result|admit\s*card)\b", "", title, flags=re.IGNORECASE)
              clean_role = re.sub(r"\s+", " ", clean_role).strip(" -–:|,")
              if len(clean_role) < 3 or len(clean_role) > 55:
                  clean_role = dept if (3 <= len(dept) <= 45) else "इस गौरवशाली पद"

              quote_text = chosen_tpl.replace("{role}", clean_role)
              return domain, quote_text

          def enrich_post_object(item):
              if not isinstance(item, dict):
                  return item

              for field in ("title", "post_title", "short_info", "summary", "description"):
                  if field in item and isinstance(item[field], str):
                      val = item[field]
                      val = re.sub(r"\b(AI-Powered|AI\s*Generated|Scraped\s*from|Feed\s*Fetched|ELON\s*CHACHA)\b", "", val, flags=re.IGNORECASE).strip()
                      item[field] = val

              raw_last = str(item.get("last_date", "") or item.get("lastDate", "") or item.get("apply_last_date", "") or "").strip()
              prev_last = str(item.get("previous_last_date", "") or "").strip()
              parsed_last = parse_any_date(raw_last)
              parsed_prev = parse_any_date(prev_last)

              is_extended = bool(item.get("is_date_extended", False)) or ("extend" in raw_last.lower())
              if parsed_last and parsed_prev and parsed_last > parsed_prev:
                  is_extended = True

              is_today_last = (parsed_last == today_date) if parsed_last else False
              days_left = (parsed_last - today_date).days if parsed_last else None

              item["is_today_last_date"] = is_today_last
              item["is_date_extended"] = is_extended
              if parsed_last:
                  item["last_date_iso"] = parsed_last.strftime("%Y-%m-%d")
                  item["days_remaining"] = days_left

              badges = []
              if is_today_last:
                  badges.append("⏳ Today Last Date")
              elif days_left is not None and 0 < days_left <= 3:
                  badges.append(f"⚡ Closing in {days_left} Days")
              if is_extended:
                  badges.append("🔥 Last Date Extended")
              if badges:
                  item["auto_date_badge"] = " | ".join(badges)

              domain, unique_quote = classify_and_build_unique_quote(item)
              item["career_intent_domain"] = domain
              item["intent_quote"] = unique_quote
              return item

          # -------------------------------------------------------------------------
          # 4. PROCESS & CLEAN jobs_database.json AND admin_boxes.json
          # -------------------------------------------------------------------------
          all_valid_jobs_for_seo = []

          jobs_path = "jobs_database.json"
          if os.path.exists(jobs_path):
              try:
                  with open(jobs_path, "r", encoding="utf-8") as f:
                      jdata = json.load(f)
                  if isinstance(jdata, dict):
                      for k, v in list(jdata.items()):
                          if isinstance(v, list):
                              cleaned_list = [enrich_post_object(x) for x in v if not is_broadsheet_leaked_item(x)]
                              jdata[k] = cleaned_list
                              for item in cleaned_list:
                                  if isinstance(item, dict) and item.get("title"):
                                      all_valid_jobs_for_seo.append(item)
                      jdata["portal_brand"] = "SARKARI NAUKAR BANEGA"
                      jdata["last_sync_ist"] = stamp_str
                      jdata["last_sync_iso"] = iso_str
                  elif isinstance(jdata, list):
                      jdata = [enrich_post_object(x) for x in jdata if not is_broadsheet_leaked_item(x)]
                      all_valid_jobs_for_seo.extend([x for x in jdata if isinstance(x, dict) and x.get("title")])
                  with open(jobs_path, "w", encoding="utf-8") as f:
                      json.dump(jdata, f, ensure_ascii=False, indent=2)
              except Exception as e:
                  print("Warning processing jobs_database.json:", e)

          admin_path = "admin_boxes.json"
          try:
              with open(admin_path, "r", encoding="utf-8") as f:
                  adm = json.load(f)
              if not isinstance(adm, dict):
                  adm = {}
          except Exception:
              adm = {}

          for k, v in list(adm.items()):
              if isinstance(v, list):
                  cleaned_list = [enrich_post_object(x) for x in v if not is_broadsheet_leaked_item(x)]
                  adm[k] = cleaned_list
                  for item in cleaned_list:
                      if isinstance(item, dict) and item.get("title"):
                          all_valid_jobs_for_seo.append(item)
              elif isinstance(v, dict):
                  for subk, subv in list(v.items()):
                      if isinstance(subv, list):
                          cleaned_sub = [enrich_post_object(x) for x in subv if not is_broadsheet_leaked_item(x)]
                          v[subk] = cleaned_sub
                          for item in cleaned_sub:
                              if isinstance(item, dict) and item.get("title"):
                                  all_valid_jobs_for_seo.append(item)

          adm["portal_brand"] = "SARKARI NAUKAR BANEGA"
          adm["last_2hr_sync_ist"] = stamp_str
          adm["last_2hr_sync_iso"] = iso_str
          adm["last_trigger_source"] = trigger_src
          with open(admin_path, "w", encoding="utf-8") as f:
              json.dump(adm, f, ensure_ascii=False, indent=2)

          # -------------------------------------------------------------------------
          # 5. STAMP the_hindu_daily.json & MARK STRICTLY AS BROADSHEET_ONLY
          # -------------------------------------------------------------------------
          hindu_path = "the_hindu_daily.json"
          if os.path.exists(hindu_path):
              try:
                  with open(hindu_path, "r", encoding="utf-8") as f:
                      hdata = json.load(f)
                  if isinstance(hdata, dict):
                      hdata["scope_lock"] = "BROADSHEET_MODAL_ONLY"
                      hdata["forbid_category_injection"] = True
                      hdata["lastUpdatedIst"] = stamp_str
                      hdata["lastSyncIso"] = iso_str
                      with open(hindu_path, "w", encoding="utf-8") as f:
                          json.dump(hdata, f, ensure_ascii=False, indent=2)
              except Exception as e:
                  print("Warning processing the_hindu_daily.json:", e)

          # -------------------------------------------------------------------------
          # 6. BUILD GOOGLE TOP SEARCH `JobPosting` JSON-LD SCHEMA, SITEMAP.XML & RSS
          # -------------------------------------------------------------------------
          seen_titles = set()
          unique_seo_jobs = []
          for jb in all_valid_jobs_for_seo:
              t = str(jb.get("title", "")).strip()
              if t and t.lower() not in seen_titles:
                  seen_titles.add(t.lower())
                  unique_seo_jobs.append(jb)

          job_postings_ld = []
          for jb in unique_seo_jobs[:60]:
              title = str(jb.get("title", "")).strip()
              org = str(jb.get("department", "") or jb.get("organization", "") or "Government of India / State Recruitment Board").strip()
              valid_thru = jb.get("last_date_iso") or (today_date + timedelta(days=21)).strftime("%Y-%m-%d")
              desc = str(jb.get("short_info", "") or jb.get("summary", "") or f"{title} official notification, eligibility, age limit, syllabus, exam date and online application link on SARKARI NAUKAR BANEGA.").strip()
              post_id = str(jb.get("id", "") or hashlib.md5(title.encode("utf-8")).hexdigest()[:10])

              job_postings_ld.append({
                  "@context": "https://schema.org/",
                  "@type": "JobPosting",
                  "title": title,
                  "description": f"<p>{xml_escape(desc)}</p>",
                  "identifier": {
                      "@type": "PropertyValue",
                      "name": "SARKARI NAUKAR BANEGA",
                      "value": post_id
                  },
                  "datePosted": today_date.strftime("%Y-%m-%d"),
                  "validThrough": f"{valid_thru}T23:59:59+05:30",
                  "employmentType": "FULL_TIME",
                  "directApply": True,
                  "hiringOrganization": {
                      "@type": "Organization",
                      "name": org,
                      "sameAs": base_site_url
                  },
                  "jobLocation": {
                      "@type": "Place",
                      "address": {
                          "@type": "PostalAddress",
                          "addressLocality": "India",
                          "addressRegion": "All India",
                          "addressCountry": "IN"
                      }
                  }
              })

          seo_bundle = {
              "@context": "https://schema.org",
              "@graph": [
                  {
                      "@type": "WebSite",
                      "name": "SARKARI NAUKAR BANEGA — Sarkari Result, Sarkari Naukri & Free Job Alert 2026",
                      "alternateName": ["Sarkari Naukar Banega", "Sarkari Naukri Banega", "Sarkari Result 2026", "Free Job Alert India"],
                      "url": base_site_url,
                      "potentialAction": {
                          "@type": "SearchAction",
                          "target": f"{base_site_url}/?q={{search_term_string}}",
                          "query-input": "required name=search_term_string"
                      }
                  },
                  {
                      "@type": "ItemList",
                      "name": "SARKARI NAUKAR BANEGA Top Recruitment Categories",
                      "itemListElement": [
                          {"@type": "SiteNavigationElement", "position": 1, "name": "Latest Jobs", "url": f"{base_site_url}/#latest-jobs"},
                          {"@type": "SiteNavigationElement", "position": 2, "name": "Result", "url": f"{base_site_url}/#results"},
                          {"@type": "SiteNavigationElement", "position": 3, "name": "Admit Card", "url": f"{base_site_url}/#admit-card"},
                          {"@type": "SiteNavigationElement", "position": 4, "name": "Answer Key", "url": f"{base_site_url}/#answer-key"},
                          {"@type": "SiteNavigationElement", "position": 5, "name": "Syllabus", "url": f"{base_site_url}/#syllabus"},
                          {"@type": "SiteNavigationElement", "position": 6, "name": "Admission", "url": f"{base_site_url}/#admission"}
                      ]
                  }
              ] + job_postings_ld
          }

          with open("google_jobs_schema.json", "w", encoding="utf-8") as f:
              json.dump(seo_bundle, f, ensure_ascii=False, indent=2)

          sitemap_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              '  <url>',
              f'    <loc>{xml_escape(base_site_url)}/</loc>',
              f'    <lastmod>{iso_str}</lastmod>',
              '    <changefreq>hourly</changefreq>',
              '    <priority>1.0</priority>',
              '  </url>'
          ]
          for idx, jb in enumerate(unique_seo_jobs[:100]):
              slug = re.sub(r"[^a-z0-9]+", "-", str(jb.get("title", "")).lower()).strip("-")[:65]
              if slug:
                  sitemap_lines.extend([
                      '  <url>',
                      f'    <loc>{xml_escape(base_site_url)}/?post={xml_escape(slug)}</loc>',
                      f'    <lastmod>{iso_str}</lastmod>',
                      '    <changefreq>daily</changefreq>',
                      '    <priority>0.9</priority>',
                      '  </url>'
                  ])
          sitemap_lines.append('</urlset>')
          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write("\n".join(sitemap_lines))

          robots_txt = f"User-agent: *\nAllow: /\nDisallow: /admin.html\nSitemap: {base_site_url}/sitemap.xml\n"
          with open("robots.txt", "w", encoding="utf-8") as f:
              f.write(robots_txt)

          print(f"[Agentic Sync Complete] Stamped databases, isolated Broadsheet, generated {len(job_postings_ld)} Google JobPosting schemas & sitemap.xml at {stamp_str}")
          EOF

      - name: Commit and Push Live Databases & Google SEO Files to GitHub
        run: |
          git config --global user.name "SarkariPortal-Bot"
          git config --global user.email "bot@sarkarinaukar.com"
          touch jobs_database.json the_hindu_daily.json admin_boxes.json google_jobs_schema.json sitemap.xml robots.txt
          git add -f jobs_database.json the_hindu_daily.json admin_boxes.json google_jobs_schema.json sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No database changes detected in this cycle."
            exit 0
          fi
          IST_NOW=$(TZ='Asia/Kolkata' date +'%d %b %Y %I:%M %p IST')
          git commit -m "Live 2-Hour Scheduled Sync [${{ github.event_name }}] at $IST_NOW"
          for attempt in 1 2 3 4; do
            echo "Pushing updated databases to main branch (Attempt $attempt/4)..."
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Successfully published live databases & Google SEO files at $IST_NOW!"
              break
            fi
            sleep 5
          done
